# 本地开发依赖：PostgreSQL + Redis。
# 服务端用 `BIND_ADDR=127.0.0.1:8088` 直连；数据卷可随时删除。
name: chiron-server-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chiron
      POSTGRES_PASSWORD: chiron
      POSTGRES_DB: chiron
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiron -d chiron"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
