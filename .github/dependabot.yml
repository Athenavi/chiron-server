version: 2

updates:
  # Rust backend
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-crypto:
        patterns:
          - "aes-gcm"
          - "argon2"
          - "hmac"
          - "sha2"
          - "jsonwebtoken"
      rust-async:
        patterns:
          - "tokio*"
          - "axum"
          - "tower*"
          - "futures-util"
          - "async-*"

  # Tenant workspace (Next.js)
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-web)"
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      ui:
        patterns:
          - "@heroui/*"
          - "tailwindcss"
          - "@tailwindcss/*"

  # Platform console (Next.js)
  - package-ecosystem: npm
    directory: "/console"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-console)"
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"

  # CI workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
